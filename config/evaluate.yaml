# Per-task chance levels, which turn a raw metric into the anchored skill
# s = clip((metric - chance) / (best - chance), +/-1). Each task is in exactly one block:
#   chance              an analytic level (0 for a rank correlation or R^2, 0.5 for a
#                       two-class AUROC)
#   chance_from_metric  the metric key under which the task reports its own measured
#                       null, usually the same fit on a model-permuted bank; read per arm
#   unanchored          tasks with no chance level
# min_external_coverage: held-out models a published board must label before its task is
# scored. aggregate_seed seeds the pooling and paired bootstraps. divergence_factor flags
# a raw metric this many chance-to-ceiling spans from chance.
chance:
  pairwise: 0.5
  answer_divergence: 0.0
  base_vs_chat: 0.5
chance_from_metric:
  cross_benchmark: spearman_permuted_null
  ranking: "ndcg@10_permuted_null"
  correctness_forecasting: column_auroc_null
  error_type: column_auroc_permuted_null
  chatbot_arena_elo: spearman_permuted_null
  alpacaeval_winrate: spearman_permuted_null
