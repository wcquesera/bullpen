# Collection settings read by collect.py / process.py (bullpen.config.CollectConfig).
# generation: the per-answer budget (greedy for standard models, sampled for the
#   reasoning models named by thinking_markers); assembly: the gates that turn the
#   per-model answer files into one cut (process.py build).

generation: the per-answer budget (greedy for standard models, sampled for the
#   reasoning models named by thinking_markers); assembly: the gates that turn the
#   per-model answer files into one cut (process.py build).
# The remaining keys locate the label-building inputs of the original collection and are
# not read by the four entry points.

probe: data/raw/probe_set.jsonl

weights_dir: data/raw/weights

external_labels_dir: data/raw/external_labels_src

generation:
  standard_max_new_tokens: 3072
  thinking_max_new_tokens: 12288
  standard_temperature: 0.0
  thinking_temperature: 0.6
  top_p: 0.95
  top_k: 20
  draws: 1
  batch_size: 8
  chunk_size: 50
  thinking_markers:
  - R1-Distill
  - Qwen3
  - QwQ
  - reasoning
  - Nemotron
  - Magistral
  - openthinker
  - sky-t1
  - skywork-or1
  - mimo
  - s1.1

