# The interview-budget sweep (Fig. K sweep): the -budget twins refitted at each K on the
# strict folds, each K into its own results/k_sweep/k<K>/ (an arm name carries no K, so two
# budgets never share a directory). Compare each twin with its full-pool arm in strict.yaml.
name: k_sweep
data:
  slice: data/paper_ckpt/slice.npz
  answers: data/paper_ckpt/answers.npz
  view: core
  raw_dir: data/raw
protocol:
  fold_scheme: grouped_all
  k_folds: 5
  seeds: [0, 1, 2]
train:
  dim: 32
  interview_k: [25, 50, 100, 200, 400]
  interview_selector: fisher
  arms: [pca_bits32__interview, pls_svd_bitsqtext32__interview, text_mean768__itext,
         pls_svd_fusion32__itext, pls_svd_tri32__itext, null_random32, null_random768]
floor:
  arms: [null_random32, null_random768]
  draws: 10
eval:
  battery: config/battery.yaml
out: results/k_sweep
