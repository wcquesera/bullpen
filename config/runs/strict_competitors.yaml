# Table 3's other rows under the strict protocol of strict.yaml: the leaderboard null, the
# IRT-2PL bits baseline and the reimplemented competitors, each read against the Gaussian
# floor at its own width (EmbedLLM 232, LOCUS and RouteLLM-MF 128, IRT-Router 25, IrtNet
# 232, JE-IRT 256, LLM DNA 128, LLMmap 384; the d=1 leaderboard null and IRT-2PL read the
# nearest floor, null_random25).
#
#   uv run python train.py --config config/runs/strict_competitors.yaml
#   uv run python eval.py  --config config/runs/strict_competitors.yaml
#
# comp_llmmap_orig is LLMmap retrained on its own 8 published probes (the paper's "LLMmap"
# row); it reads llmmap_probe_bank.npz beside the slice, and models without all 8 probe
# answers take the mean signature. comp_embedllm, comp_locus and the IRT-family
# competitors read the all-mpnet question table data/question_text_mpnet.npz.
name: strict_competitors
data:
  slice: data/paper_ckpt/slice.npz
  answers: data/paper_ckpt/answers.npz
  view: core
  raw_dir: data/raw
protocol:
  fold_scheme: grouped_all
  k_folds: 5
  seeds: [0, 1, 2]
train:
  dim: 32
  arms:
    - null_leaderboard
    - bits_irt2pl
    - comp_embedllm
    - comp_locus
    - comp_routellm_mf
    - comp_irtrouter
    - comp_jeirt
    - comp_irtnet
    - comp_llmmap_orig
    - comp_llmdna
floor:
  arms: [null_random25, null_random32, null_random128, null_random232, null_random256,
         null_random384]
  draws: 10
eval:
  battery: config/battery.yaml
out: results/strict_competitors
