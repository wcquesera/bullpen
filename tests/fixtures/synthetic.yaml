# The synthetic fixture run (tests/test_e2e.py): 72 invented models x 160 templated
# questions (tests/fixtures/synthetic/, regenerated by make_sample_data.py). The test builds
# the cut into a temporary directory and points data.slice / data.answers there.
#
# The protocol mirrors strict.yaml at toy scale: 3 publisher-grouped folds x 1 seed, the five
# main-text encoders and their -budget twins, a K = 40 interview, and a 3-draw floor.
name: synthetic
data:
  slice: results/synthetic/cut/slice.npz
  answers: results/synthetic/cut/answers.npz
  raw_dir: tests/fixtures/synthetic/raw   # model footprints (families for the grouped folds)
protocol:
  fold_scheme: grouped_all
  k_folds: 3
  seeds: [0]
train:
  dim: 32
  interview_k: 40
  interview_selector: fisher
  arms: [pca_bits32, pls_svd_bitsqtext32, text_mean768, pls_svd_fusion32, pls_svd_tri32,
         pca_bits32__interview, pls_svd_bitsqtext32__interview, text_mean768__itext,
         pls_svd_fusion32__itext, pls_svd_tri32__itext, null_random32]
floor:
  arms: [null_random32]
  draws: 3
eval:
  battery: config/battery_quick.yaml     # 3 head folds, 2 knapsack draws: toy scale only
  benchmark_groups: tests/fixtures/synthetic/benchmark_groups.yaml
  transfer: true
out: results/synthetic
